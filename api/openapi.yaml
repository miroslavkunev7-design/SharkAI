        fees_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
        deposits_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
        withdrawals_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
