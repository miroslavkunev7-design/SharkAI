        status: {enum: [ok, unavailable, 'needs_human']}
        code: {type: string}
        source: {const: shark-ai-wallet}
        timestamp: {type: string, format: date-time}
        data: {type: [object, 'null']}
        operation: {$ref: '#/components/schemas/WalletOperation'}
    InvestmentRead:
      type: object
