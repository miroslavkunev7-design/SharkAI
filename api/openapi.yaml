        - {if: {properties: {kind: {const: history}}}, then: {properties: {data: {$ref: '#/components/schemas/HistoryEvidence'}}}}
        - {if: {properties: {kind: {const: 'weekly_report'}}}, then: {properties: {data: {$ref: '#/components/schemas/WeeklyEvidence'}}}}
