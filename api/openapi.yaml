      properties: {message: {type: string, minLength: 1, maxLength: 16000}}
    AgentReply:
      type: object
      additionalProperties: false
      required: [status, reply]
      properties: {status: {enum: [ok, 'needs_human']}, reply: {type: string, minLength: 1, maxLength: 16000}}
    Grant:
      type: object
      additionalProperties: false
      required: [grant, 'expires_in']
      properties: {grant: {type: string, description: 'Short-lived owner-bound JWT.'}, expires_in: {const: 120}}
    Accepted: {type: object, additionalProperties: false, required: [status], properties: {status: {const: accepted}}}
    Consent:
      type: object
      additionalProperties: false
      required: [review, accepted]
      properties:
        review:
          type: string
          minLength: 50
          maxLength: 1500
          description: 'Short-lived signed review for the authenticated owner and immutable terms.'
        accepted: {const: true}
    MandateTerms:
      type: object
      additionalProperties: false
      required: ['policy_id', provider, plan, currency, 'capital_minor', 'max_loss_minor', 'max_positions', assets, strategy, period, days, 'start_date', 'goal_minor', 'goal_bps', 'expires_at', 'capital_source', 'protection_policy_id', 'protection_digest', 'performance_fee_bps']
      properties:
        policy_id: {type: string, format: uuid}
        provider: {enum: [ibkr, saxo]}
        plan: {enum: [PRO, ULTRA]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capital_minor: {$ref: '#/components/schemas/PositiveMinor'}
        max_loss_minor: {$ref: '#/components/schemas/PositiveMinor'}
        max_positions: {type: integer, minimum: 1, maximum: 64}
        assets: {type: array, items: {type: string, minLength: 1, maxLength: 128}, minItems: 1, maxItems: 64}
        strategy: {type: string, minLength: 1, maxLength: 100}
        period: {enum: [DAY, WEEK, 'CUSTOM_DAYS', MONTH]}
        days: {type: [integer, 'null'], minimum: 1}
        start_date: {type: string, format: date}
        goal_minor: {anyOf: [{$ref: '#/components/schemas/PositiveMinor'}, {type: 'null'}]}
        goal_bps: {type: [integer, 'null'], minimum: 1}
        expires_at: {type: string, format: date-time}
        capital_source: {const: 'verified_settled_realized_profit_only'}
        protection_policy_id: {type: string, format: uuid}
        protection_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        performance_fee_bps: {const: 1000}
    MandateView:
      type: object
      additionalProperties: false
      required: [active, offers]
      properties:
        active:
          type: [object, 'null']
          additionalProperties: false
          required: [terms, 'accepted_at', valid]
          properties:
            terms: {$ref: '#/components/schemas/MandateTerms'}
            accepted_at: {type: string, format: date-time}
            valid: {type: boolean}
        offers:
          type: array
