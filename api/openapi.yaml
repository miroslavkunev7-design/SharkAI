        median_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
        upper_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
        worst_observed_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
        best_observed_minor: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)$'}
