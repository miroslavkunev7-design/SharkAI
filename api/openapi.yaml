    Status: {type: object, required: [status], properties: {status: {type: string}, code: {type: string}}}
    Empty: {type: object, maxProperties: 0, description: 'An empty HTTP body is also accepted.'}
    Identifier: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
    UnixTime: {type: string, pattern: '^[0-9]{10}$'}
    PositiveMinor:
