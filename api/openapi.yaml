              terms: {$ref: '#/components/schemas/MandateTerms'}
              review:
                type: string
                minLength: 50
                maxLength: 1500
                description: 'Short-lived signed review for the authenticated owner and immutable terms.'
          maxItems: 5
    Target:
      description: 'Custom days is populated only for period days. At most one goal amount or basis-point return may be set. The start date must yield a valid calendar horizon.'
      type: object
      additionalProperties: false
      required: [period, days, 'amount_minor', 'return_bps', 'start_date']
      properties:
        period: {enum: [day, days, week, month]}
        days: {type: [integer, 'null'], minimum: 1, maximum: 2147483647}
        amount_minor: {anyOf: [{$ref: '#/components/schemas/PositiveMinor'}, {type: 'null'}]}
        return_bps: {type: [integer, 'null'], minimum: 1, maximum: 2147483647}
        start_date: {type: string, format: date}
    SettingsInput:
      description: 'Currency is required for monetary limits. Supply null for unselected values.'
