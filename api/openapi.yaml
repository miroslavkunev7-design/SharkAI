      type: object
      additionalProperties: false
      required: ['binding_id', provider, 'provider_account_key', 'snapshot_id', 'observed_at', 'provider_report_id', 'provider_evidence_sha256', currency, 'instrument_code', 'strategy_label', kind, data]
      properties:
        binding_id: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
        provider: {enum: [ibkr, saxo]}
        provider_account_key: {type: string, pattern: '^[A-Za-z0-9_+=/-]{1,128}$'}
        snapshot_id: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
        observed_at: {type: string, format: date-time}
        provider_report_id: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
        provider_evidence_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
