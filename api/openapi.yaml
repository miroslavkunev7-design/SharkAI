openapi: 3.1.0
info:
  title: Shark AI wallet, investments, commerce and research API
  version: 1.0.0
  description: >-
    Owner-facing website routes and private n8n, broker-evidence and trading-worker routes.
    Minor-unit strings represent exact integers in the named currency. Provider availability and
    authorization are checked at runtime. A read grant confers no permission to submit a broker order.
paths:
  /api/research/{domain}:
    get:
      operationId: getOwnerResearch
      summary: "Compare verified investment strategies or drop-shipping products."
      description: "Optional horizonDays applies only to investments and defaults to seven. Ties, preliminary catalog entries or missing independent evidence can leave leader_id null."
      security: [{Session: []}]
      parameters:
        - {name: domain, in: path, required: true, schema: {enum: [investments, products]}}
        - {name: currency, in: query, required: false, schema: {type: string, pattern: '^[A-Z]{3}$'}, description: "A single supported currency."}
        - {name: horizonDays, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 366}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ResearchResult'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '404': {$ref: '#/components/responses/HTTP404'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/research/investments:
    post:
      operationId: readScopedStrategyResearch
      summary: "Read investment comparisons for the grant owner."
      description: "Uses the currency and horizon in the owner’s saved settings."
      security: [{FinanceService: [], FinanceGrant: []}]
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/Empty'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ResearchResult'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/research/products:
    post:
      operationId: readScopedProductResearch
      summary: "Read owner-scoped product comparisons."
      description: "Requires a current commerce analytics grant; send an empty JSON object."
      security: [{FinanceService: [], CommerceGrant: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommerceGrantBody'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ResearchResult'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce:
    get:
      operationId: getCommerceDashboard
      summary: "Read store orders, daily financials and approved fulfillment capital."
      description: "The authenticated owner sees only data for the selected period and currency."
      security: [{Session: []}]
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}, description: "Defaults to 29 days before today in Europe/Sofia."}
        - {name: to, in: query, required: false, schema: {type: string, format: date}, description: "Defaults to today. Maximum difference from the start is 366 days."}
        - {name: currency, in: query, required: false, schema: {enum: [EUR, USD, GBP, BGN], default: EUR}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CommerceDashboard'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce/shopify-connection:
    get:
      operationId: getShopifyConnection
      summary: Verify the signed-in owner's bound Shopify store and read access.
      description: Checks the store identity and distinguishes a confirmed empty order history in Shopify's normal 60-day window from an unverified order query.
      security: [{Session: []}]
      responses:
        '200': {description: Connection checked., content: {application/json: {schema: {$ref: '#/components/schemas/ShopifyConnection'}}}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce/procurement:
    get:
      operationId: getOwnerProcurement
      summary: Read warehouse offers, approved mandates and reconciled receipts.
      description: Returns up to 100 inventory offers for the owner.
      security: [{Session: []}]
      responses:
        '200': {description: Request processed., content: {application/json: {schema: {$ref: '#/components/schemas/ProcurementSummary'}}}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
    post:
      operationId: changeOwnerProcurement
      summary: Review or confirm an offer or grant or revoke bounded automation.
      description: A confirmed purchase order is sent only to the approved supplier through the bound Zoho organization. An uncertain submission requires supplier reconciliation.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ProcurementInput'}}
      responses:
        '200': {description: Request processed., content: {application/json: {schema: {$ref: '#/components/schemas/ProcurementOutput'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/commerce/procurement-run:
    post:
      operationId: runApprovedPurchases
      summary: Process approved warehouse procurement.
      description: Checks at most three due stock offers against the current mandate and fresh supplier records. Explicit owner authorization, spending limits and budget checks apply before dispatch.
      security: [{ProcurementScheduler: []}]
      responses:
        '200': {description: Request processed., content: {application/json: {schema: {$ref: '#/components/schemas/ProcurementRun'}}}}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/commerce/procurement-evidence:
    post:
      operationId: receiveStockEvidence
      summary: Verify a cleared stock purchase, received inventory or settled resale statement.
      description: HMAC over sharkai-stock/v1 plus LF, collector ID plus LF, Unix seconds plus LF and the exact raw bytes. Maximum age is 30 seconds and body size is 8192 bytes. A receipt also requires a matching provider warehouse record.
      security: [{CommerceSignature: []}]
      parameters:
        - {name: X-Shark-Commerce-Collector, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
        - {name: X-Shark-Commerce-Time, in: header, required: true, schema: {$ref: '#/components/schemas/UnixTime'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StockEvidence'}}
      responses:
        '200': {description: Request processed., content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce/settlement:
    get:
      operationId: getResaleSettlement
      summary: Read verified weekly resale gains, loss and owner allocations.
      security: [{Session: []}]
      parameters:
        - {name: currency, in: query, required: false, schema: {enum: [EUR, USD, GBP, BGN], default: EUR}}
      responses:
        '200': {description: Owner request processed., content: {application/json: {schema: {$ref: '#/components/schemas/ResaleSettlement'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
    put:
      operationId: setResaleTarget
      summary: Set the current weekly resale target in the chosen currency.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ResaleTarget'}}
      responses:
        '200': {description: Owner request processed., content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
    post:
      operationId: allocateSettledResaleProfit
      summary: Choose the amount to reinvest from a closed week. The remainder is reserved for the owner.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ResaleAllocation'}}
      responses:
        '200': {description: Owner request processed., content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce/capital:
    put:
      operationId: setCommerceCapital
      summary: "Set the owner’s commerce capital limit and optionally permit agent reads."
      description: "Authorization is specific to the signed-in owner and approved currency."
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommerceCapInput'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/commerce/fulfillment:
    post:
      operationId: reviewOrConfirmFulfillment
      summary: "Review or explicitly confirm a Printful order."
      description: "Confirmation can commit real supplier funds and requires a valid review of the same paid Shopify order and bounded cost. An uncertain outcome requires provider reconciliation."
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommerceFulfillmentInput'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CommerceFulfillmentResult'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/commerce/overview:
    post:
      operationId: readScopedCommerceOverview
      summary: "Read summarized store performance and available commerce capital."
      description: "Requires the owner’s commerce analytics grant; send an empty JSON object."
      security: [{FinanceService: [], CommerceGrant: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommerceGrantBody'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CommerceOverview'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/commerce/evidence:
    post:
      operationId: recordCommerceEvidence
      summary: "Record an approved catalog, daily settled report or segregated cash statement."
      description: "Sign the lines sharkai-commerce/v1, collector ID and Unix timestamp, each followed by LF, then the exact raw JSON bytes. Maximum age ±30 seconds and body 262144 bytes. Source role and registered store contract must match the event."
      security: [{CommerceSignature: []}]
      parameters:
        - {name: X-Shark-Commerce-Collector, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
        - {name: X-Shark-Commerce-Time, in: header, required: true, schema: {$ref: '#/components/schemas/UnixTime'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommerceEvidence'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '415': {description: Expected application/json.}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/integrations/commerce/printful:
    post:
      operationId: receivePrintfulNotification
      summary: Record a supplier order notification for a configured store.
      description: Verify the raw body with the secret selected by the Printful public key. An observation does not release reserved money.
      security: [{PrintfulSignature: []}]
      parameters:
        - {name: X-PF-Webhook-Public-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9+/=_-]{12,512}$'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PrintfulNotification'}}
      responses:
        '200': {description: 'Observation recorded, replayed or unmatched.', content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/integrations/commerce/shopify:
    post:
      operationId: receiveShopifyNotification
      summary: "Verify a Shopify order or refund notification."
      description: "Read the original body to verify the Shopify HMAC. The service subsequently verifies the order against the bound store."
      security: [{ShopifySignature: []}]
      parameters:
        - {name: X-Shopify-Shop-Domain, in: header, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,61}\.myshopify\.com$'}}
        - {name: X-Shopify-Topic, in: header, required: true, schema: {enum: [orders/paid, orders/updated, orders/cancelled, refunds/create]}}
        - {name: X-Shopify-Webhook-Id, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ShopifyNotification'}}
      responses:
        '200':
          description: Successful request. Consult the result status for readiness or confirmation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/admin/performance-fees:
    get:
      operationId: getAdministratorFeeReceipts
      summary: Read registrations by plan, paginated members and provider fee totals for a date range.
      description: >-
        Requires the named beneficiary administrator's session. Dates are inclusive in Europe/Sofia.
        The default range starts on the first day of the current month and ends today. Registrations
        and the existing product plans are reported separately from accrued fees, credits and reversals.
      security: [{Session: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}, description: First date of the report.}
        - {in: query, name: to, schema: {type: string, format: date}, description: Last date on or after from.}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 999999999, default: 1}, description: Page of 20 members.}
      responses:
        '200':
          description: Member counts and paginated registrations with per-currency settlement totals.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AdministratorFees'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/performance-fee:
    post:
      operationId: recordPerformanceFeeStatement
      summary: Record a settled period, an already-posted fee credit, or its full reversal.
      description: >-
        This receipt endpoint does not initiate an external payment. A separately registered licensed
        partner must post both the client debit and the approved beneficiary credit. Send UTF-8 JSON
        with at most 4096 bytes. Sign the lines sharkai-performance-fee/v1, collector ID and Unix
        timestamp, each followed by LF, then the exact body bytes with the fee collector's HMAC-SHA256
        key. The signed timestamp must be within 60 seconds of server time.
      security: [{FeeSignature: []}]
      parameters:
        - {in: header, name: X-Shark-Fee-Collector, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
        - {in: header, name: X-Shark-Fee-Time, required: true, schema: {$ref: '#/components/schemas/UnixTime'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/FeeEvent'}}
      responses:
        '200':
          description: Credited, reversed, or identical evidence replayed.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '201':
          description: A reconciled period was recorded.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '415':
          description: Expected application/json.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments:
    get:
      operationId: getWalletDashboard
      summary: "Read the signed-in owner’s wallet and investment dashboard."
      security: [{Session: []}]
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/OwnerDashboard'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
    put:
      operationId: saveWalletSettings
      summary: "Save the authorized capital, analysis access, instrument, strategy and target period."
      description: >-
        Saving settings refreshes the access revision. Live trading requires a separate confirmed broker mandate.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SettingsInput'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/OwnerDashboard'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/agent:
    post:
      operationId: askWalletAgent
      summary: "Ask the original Shark AI agent a question."
      description: >-
        The server adds the scoped finance grant when analysis access is enabled.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AgentQuestion'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AgentReply'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/revoke:
    post:
      operationId: revokeWalletAccess
      summary: "Revoke the owner’s AI access and stop further authorized trading."
      description: >-
        Returns the updated dashboard. Broker orders already submitted may still require reconciliation.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/OwnerDashboard'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/status-grant:
    post:
      operationId: issueFinanceGrant
      summary: "Issue a two-minute, revocable finance read grant."
      description: >-
        Requires analysis access. The grant is issued to the signed-in owner.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Grant'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/trading-consent:
    get:
      operationId: getBrokerMandates
      summary: "Read current broker mandate terms and offers."
      description: >-
        An offer includes a signed, owner-bound five-minute review token. Disabled or ineligible accounts can receive an empty offer list.
      security: [{Session: []}]
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/MandateView'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '503': {$ref: '#/components/responses/HTTP503'}
    post:
      operationId: confirmBrokerMandate
      summary: "Accept the exact terms in a current review."
      description: >-
        Requires the owner session, a current paid plan, a valid account policy and fresh evidence. Maximum request size 2048 bytes.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Consent'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Accepted'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/provider/deposits:
    post:
      operationId: getOwnerDeposits
      summary: "Read posted deposits from the owner’s Wise balance statement."
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/OwnerDeposits'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/provider/review:
    post:
      operationId: getOwnerKycReview
      summary: "Read the owner’s verified Wise KYC review status."
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ReviewStatus'}}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/wallet-investments/provider/onboarding:
    post:
      operationId: openOwnerOnboarding
      summary: "Open the owner’s Wise hosted verification session."
      description: >-
        Onboarding redirects to the validated provider URL, or to the dashboard with wallet_review=unavailable when no link is available.
      security: [{Session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '303': {$ref: '#/components/responses/HTTP303'}
        '401': {$ref: '#/components/responses/HTTP401'}
        '403': {$ref: '#/components/responses/HTTP403'}
  /api/internal/wallet-investments/status:
    post:
      operationId: getScopedFinanceStatus
      summary: "Read the finance projection for the subject of the grant."
      security: [{FinanceService: [], FinanceGrant: []}]
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/Empty'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ScopedDashboard'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/investment/{operation}:
    post:
      operationId: readInvestmentOperation
      summary: "Read the selected investment workflow’s status."
      description: >-
        Order gateway and kill-switch here are read-only status checks. Broker submission has a separate worker route.
      security: [{FinanceService: [], FinanceGrant: []}]
      parameters:
        - {$ref: '#/components/parameters/InvestmentOperation'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/Empty'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/InvestmentRead'}}
        '404': {$ref: '#/components/responses/HTTP404'}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/wallet/{operation}:
    post:
      operationId: readWalletOperation
      summary: "Read one wallet workflow projection."
      description: >-
        Withdrawal returns a Wise owner-confirmation handoff when available. No balance is changed by these reads.
      security: [{FinanceService: [], FinanceGrant: []}]
      parameters:
        - {$ref: '#/components/parameters/WalletOperation'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/Empty'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WalletRead'}}
        '404': {$ref: '#/components/responses/HTTP404'}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/diagnostics:
    post:
      operationId: runModuleDiagnostics
      summary: "Probe configured systems and report individual results."
      description: >-
        Uses the server-selected diagnostic owner. A successful response may contain failed or unverified checks.
      security: [{FinanceService: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Probe'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/DiagnosticReport'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
  /api/internal/wallet-investments/forecast-source:
    post:
      operationId: ingestForecastEvidence
      summary: "Record broker funding, strategy history or a completed weekly report."
      description: >-
        HMAC-SHA256 over sharkai-broker-forecast/v1, connector ID and timestamp, each followed by LF, then the exact raw body. The timestamp must fall within 60 seconds of server time. Maximum body 3,000,000 bytes.
      security: [{ForecastSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/ForecastConnector'}
        - {$ref: '#/components/parameters/ForecastTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ForecastEvidence'}}
      responses:
        '200':
          description: Identical evidence replayed.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '201':
          description: Evidence recorded.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '413': {$ref: '#/components/responses/HTTP413'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/signal:
    post:
      operationId: recordStrategySignal
      summary: "Record a strategy decision against a specific broker mandate."
      description: >-
        Use the registered strategy signer. Matching separately signed broker evidence is required to queue the job. HMAC-SHA256 over shark-order-v1, the operation, signer ID and timestamp, each followed by LF, then the exact UTF-8 JSON bytes. The timestamp must be between zero and 15 seconds old. Maximum body 4096 bytes.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Signal'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/quote:
    post:
      operationId: recordBrokerQuote
      summary: "Record a fresh broker quote and maximum charges for a signal."
      description: >-
        Use the independently registered broker-evidence signer. Both packets must agree on the order terms. HMAC-SHA256 over shark-order-v1, the operation, signer ID and timestamp, each followed by LF, then the exact UTF-8 JSON bytes. The timestamp must be between zero and 15 seconds old. Maximum body 4096 bytes.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Quote'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/account-snapshot:
    post:
      operationId: recordBrokerSnapshot
      summary: "Record verified settled cash, exposure, holdings and optional mandate performance."
      description: >-
        Use the broker-evidence signer. Only list reconciled closed jobs. HMAC-SHA256 over shark-order-v1, the operation, signer ID and timestamp, each followed by LF, then the exact UTF-8 JSON bytes. The timestamp must be between zero and 15 seconds old. Maximum body 32768 bytes.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AccountSnapshot'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/profit-evidence:
    post:
      operationId: recordAuditedProfitEvidence
      summary: Reconcile cleared trading profits for the registered non-recourse account.
      description: >-
        Requires an independent profit auditor with a distinct signer ID, HMAC key and database role.
        Sign the lines shark-order-v1, profit-evidence, signer ID and Unix timestamp, each followed by
        LF, then the exact JSON bytes. Maximum age 15 seconds and maximum body 4096 bytes. The signed
        policy digest and settled broker snapshot must match an approved segregated account. Counters
        are cumulative for its immutable history. Principal, external contributions and unrealized
        gains cannot fund orders. Record gross gains and losses separately, all costs including fees,
        distributions, open cost basis, unrealized losses and the actual cash remaining in that account.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ProfitEvidence'}}
      responses:
        '200':
          description: Immutable evidence recorded or replayed.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/submit:
    post:
      operationId: submitApprovedJob
      summary: "Submit a previously approved single-use job to its actual broker."
      description: >-
        Use the registered execution worker. Execution can move real funds and requires a current bounded owner mandate. A 202 UNKNOWN result requires reconciliation before any further submission. HMAC-SHA256 over shark-order-v1, the operation, signer ID and timestamp, each followed by LF, then the exact UTF-8 JSON bytes. The timestamp must be between zero and 15 seconds old. Maximum body 512 bytes.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/JobCommand'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '202':
          description: Provider result uncertain. Inspect durable state and reconcile.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '404': {$ref: '#/components/responses/HTTP404'}
        '503': {$ref: '#/components/responses/HTTP503'}
  /api/internal/wallet-investments/worker/poll:
    post:
      operationId: pollSubmittedJob
      summary: "Read and reconcile broker-confirmed progress for an existing job."
      description: >-
        Use the registered execution worker and the original submission nonce. Polling does not create another order. HMAC-SHA256 over shark-order-v1, the operation, signer ID and timestamp, each followed by LF, then the exact UTF-8 JSON bytes. The timestamp must be between zero and 15 seconds old. Maximum body 512 bytes.
      security: [{OrderSignature: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderSigner'}
        - {$ref: '#/components/parameters/OrderTime'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/JobCommand'}}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Status'}}
        '400': {$ref: '#/components/responses/HTTP400'}
        '403': {$ref: '#/components/responses/HTTP403'}
        '409': {$ref: '#/components/responses/HTTP409'}
        '404': {$ref: '#/components/responses/HTTP404'}
        '503': {$ref: '#/components/responses/HTTP503'}
components:
  securitySchemes:
    CommerceGrant: {type: apiKey, in: header, name: X-Shark-Commerce-Grant, description: Owner-bound two-minute HS256 JWT with commerce:analytics:read scope and current revision.}
    CommerceSignature: {type: apiKey, in: header, name: X-Shark-Commerce-Signature, description: Lowercase hexadecimal HMAC-SHA256 from the registered commerce collector.}
    ShopifySignature: {type: apiKey, in: header, name: X-Shopify-Hmac-Sha256, description: Base64 HMAC-SHA256 of the raw Shopify body under the authenticated shop secret.}
    ProcurementScheduler: {type: http, scheme: bearer, description: Dedicated stock scheduler service credential.}
    PrintfulSignature: {type: apiKey, in: header, name: X-PF-Webhook-Signature, description: Hex HMAC-SHA256 of the raw Printful body using the registered store secret.}
    FeeSignature: {type: apiKey, in: header, name: X-Shark-Fee-Signature, description: Lowercase hexadecimal HMAC-SHA256 from the independently registered fee collector.}
    Session: {type: apiKey, in: cookie, name: sharkai_token, description: Signed HTTP-only Shark AI session cookie.}
    FinanceService: {type: http, scheme: bearer, description: Private finance service credential configured on the server.}
    FinanceGrant: {type: apiKey, in: header, name: X-Shark-Finance-Grant, description: Owner-bound HS256 JWT with finance:status:read scope and current access revision.}
    ForecastSignature: {type: apiKey, in: header, name: X-Shark-Forecast-Signature, description: Lowercase hexadecimal HMAC-SHA256 with the registered connector key.}
    OrderSignature: {type: apiKey, in: header, name: X-Shark-Order-Signature, description: Lowercase hexadecimal HMAC-SHA256 with the key for the operation-specific signer role.}
  parameters:
    Origin: {name: Origin, in: header, required: true, description: Must match request protocol and Host., schema: {type: string, format: uri}}
    ForecastConnector: {name: X-Shark-Forecast-Connector, in: header, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    ForecastTime: {name: X-Shark-Forecast-Signed-At, in: header, required: true, schema: {$ref: '#/components/schemas/UnixTime'}}
    OrderSigner: {name: X-Shark-Order-Worker, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
    OrderTime: {name: X-Shark-Order-Time, in: header, required: true, schema: {$ref: '#/components/schemas/UnixTime'}}
    InvestmentOperation: {name: operation, in: path, required: true, schema: {$ref: '#/components/schemas/InvestmentOperation'}}
    WalletOperation: {name: operation, in: path, required: true, schema: {$ref: '#/components/schemas/WalletOperation'}}
  responses:
    HTTP303:
      description: Owner browser redirect to Wise or the dashboard.
      headers:
        Location: {required: true, schema: {type: string, format: uri-reference}}
    HTTP400:
      description: "Malformed or unexpected request."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP401:
      description: "A current owner session is required."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP403:
      description: "Origin, grant, ownership or signer check failed."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP404:
      description: "Unknown operation or job."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP409:
      description: "Review, evidence or broker state does not allow this operation."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP413:
      description: "Forecast evidence body is missing, oversized or could not be read within the deadline."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
    HTTP503:
      description: "The configured service, data source or prerequisite is unavailable."
      content:
        application/json: {schema: {$ref: '#/components/schemas/Status'}}
  schemas:
    ResearchResult:
      type: "object"
      additionalProperties: false
      required: ["domain", "status", "as_of", "currency", "criteria", "candidates", "leader_id"]
      properties:
        domain: {enum: ["investments", "dropshipping"]}
        status: {enum: ["ranked", "insufficient_data", "unavailable"]}
        as_of: {type: "string", format: "date-time"}
        currency: {type: ["string", "null"], pattern: "^[A-Z]{3}$"}
        criteria: {type: "array", items: {type: "string"}}
        candidates: {type: "array", items: {$ref: "#/components/schemas/ResearchCandidate"}}
        leader_id: {type: ["string", "null"]}
    ResearchCandidate:
      type: "object"
      additionalProperties: false
      required: ["id", "label", "rank", "status", "metrics", "reasons"]
      properties:
        id: {type: "string"}
        label: {type: "string"}
        rank: {type: ["integer", "null"], minimum: 1}
        status: {enum: ["eligible", "insufficient_data", "validation_candidate"]}
        metrics:
          type: "object"
          additionalProperties: {type: ["number", "string", "null"]}
          description: "Ratios are basis points. Amounts ending in _minor are exact integer strings. Includes provider timestamps, historical windows and sample sizes."
        reasons: {type: "array", items: {type: "string"}}
    CommerceGrantBody: {type: "object", maxProperties: 0}
    CommerceCapInput:
      type: "object"
      additionalProperties: false
      required: ["currency", "amount_minor"]
      properties:
        currency: {enum: ["EUR", "USD", "GBP", "BGN"]}
        amount_minor: {type: "string", pattern: "^(0|[1-9][0-9]{0,11})$"}
        agent_read_allowed: {type: "boolean"}
    CommerceFulfillmentInput:
      oneOf:
        - {type: "object", additionalProperties: false, required: ["order_ref", "action"], properties: {order_ref: {type: "string", pattern: "^[1-9][0-9]{0,19}$"}, action: {const: "review"}}}
        - {type: "object", additionalProperties: false, required: ["order_ref", "action", "review_id"], properties: {order_ref: {type: "string", pattern: "^[1-9][0-9]{0,19}$"}, action: {const: "confirm"}, review_id: {type: "string", format: "uuid"}}}
    CommerceFulfillmentResult:
      oneOf:
        - {type: "object", additionalProperties: false, required: ["status", "review_id", "currency", "max_cost_minor", "expires_at"], properties: {status: {const: "reviewed"}, review_id: {type: "string", format: "uuid"}, currency: {enum: ["EUR", "USD", "GBP", "BGN"]}, max_cost_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}, expires_at: {type: "string", format: "date-time"}}}
        - {type: "object", additionalProperties: false, required: ["status"], properties: {status: {enum: ["blocked", "accepted", "uncertain", "unavailable"]}}}
    CommerceDashboard:
      type: "object"
      additionalProperties: false
      required: ["status", "currency", "from", "to", "source_observed_at", "period_complete", "shop", "capital", "orders", "daily"]
      properties:
        status: {enum: ["available", "unavailable"]}
        currency: {enum: ["EUR", "USD", "GBP", "BGN"]}
        from: {type: "string", format: "date"}
        to: {type: "string", format: "date"}
        source_observed_at: {type: ["string", "null"], format: "date-time"}
        period_complete: {type: "boolean"}
        shop:
          type: "object"
          additionalProperties: false
          required: ["connected", "supplier_connected"]
          properties: {connected: {type: "boolean"}, supplier_connected: {type: "boolean"}}
        capital:
          type: "object"
          additionalProperties: false
          required: ["limit_minor", "cash_minor", "held_minor", "available_minor", "observed_at", "agent_read_allowed"]
          properties:
            limit_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
            cash_minor: {type: ["string", "null"], pattern: "^(0|[1-9][0-9]*)$"}
            held_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
            available_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
            observed_at: {type: ["string", "null"], format: "date-time"}
            agent_read_allowed: {type: "boolean"}
        orders:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["order_ref", "status", "total_minor", "refunded_minor", "ordered_at", "source_observed_at", "fulfillment"]
            properties:
              order_ref: {type: "string", pattern: "^[1-9][0-9]{0,19}$"}
              status: {enum: ["paid", "pending", "cancelled", "refunded", "partially_refunded"]}
              total_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              refunded_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              ordered_at: {type: "string", format: "date-time"}
              source_observed_at: {type: "string", format: "date-time"}
              fulfillment: {enum: ["none", "reviewed", "submitting", "accepted", "uncertain"]}
          maxItems: 100
        daily:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["date", "orders", "units", "revenue_minor", "refunds_minor", "goods_minor", "fulfillment_minor", "advertising_minor", "fees_minor", "other_costs_minor"]
            properties:
              date: {type: "string", format: "date"}
              orders: {type: "integer", minimum: 0}
              units: {type: "integer", minimum: 0}
              revenue_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              refunds_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              goods_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              fulfillment_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              advertising_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              fees_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
              other_costs_minor: {type: "string", pattern: "^(0|[1-9][0-9]*)$"}
          maxItems: 367
    CommerceOverview:
      oneOf:
        - {"type":"object","additionalProperties":false,"required":["status","source","reason"],"properties":{"status":{"const":"unavailable"},"source":{"const":"shark-ai-commerce"},"reason":{"const":"verified_store_required"}}}
        - {"type":"object","additionalProperties":false,"required":["status","source","currency","from","to","observed_at","period_complete","verified_days","reported","capital","weekly","recent_procurement"],"properties":{"status":{"enum":["available","unavailable"]},"source":{"const":"shark-ai-commerce"},"currency":{"enum":["EUR","USD","GBP","BGN"]},"from":{"type":"string","format":"date"},"to":{"type":"string","format":"date"},"observed_at":{"type":["string","null"],"format":"date-time"},"period_complete":{"type":"boolean"},"verified_days":{"type":"integer","minimum":0},"reported":{"type":["object","null"],"additionalProperties":false,"required":["orders","units","revenue_minor","refunds_minor","cost_minor","net_margin_minor"],"properties":{"orders":{"type":"integer","minimum":0},"units":{"type":"integer","minimum":0},"revenue_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"refunds_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"cost_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"net_margin_minor":{"type":"string","pattern":"^-?(0|[1-9][0-9]*)$"}}},"capital":{"type":"object","additionalProperties":false,"required":["available_minor","held_minor","observed_at"],"properties":{"available_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"held_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"observed_at":{"type":["string","null"],"format":"date-time"}}},"weekly":{"type":"object","additionalProperties":false,"required":["period","last_closed","owner_reserved_minor","owner_paid_minor"],"properties":{"period":{"type":["object","null"],"additionalProperties":false,"required":["start_date","end_date","target_minor","verified_profit_minor","verified_days"],"properties":{"start_date":{"type":"string","format":"date"},"end_date":{"type":"string","format":"date"},"target_minor":{"type":["string","null"],"pattern":"^(0|[1-9][0-9]*)$"},"verified_profit_minor":{"type":["string","null"],"pattern":"^(0|-?[1-9][0-9]*)$"},"verified_days":{"type":"integer","minimum":0,"maximum":7}}},"last_closed":{"type":["object","null"],"additionalProperties":false,"required":["start_date","end_date","target_minor","profit_minor","allocable_minor","reinvested_minor","owner_minor","status"],"properties":{"start_date":{"type":"string","format":"date"},"end_date":{"type":"string","format":"date"},"target_minor":{"type":["string","null"],"pattern":"^(0|[1-9][0-9]*)$"},"profit_minor":{"type":"string","pattern":"^(0|-?[1-9][0-9]*)$"},"allocable_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"reinvested_minor":{"type":["string","null"],"pattern":"^(0|[1-9][0-9]*)$"},"owner_minor":{"type":["string","null"],"pattern":"^(0|[1-9][0-9]*)$"},"status":{"enum":["awaiting_allocation","allocated","no_profit"]}}},"owner_reserved_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"},"owner_paid_minor":{"type":"string","pattern":"^(0|[1-9][0-9]*)$"}}},"recent_procurement":{"type":["object","null"],"additionalProperties":false,"required":["offers_shown","limit","issued","received_units","confirmed_sold_units"],"properties":{"offers_shown":{"type":"integer","minimum":0,"maximum":100},"limit":{"const":100},"issued":{"type":"integer","minimum":0},"received_units":{"type":"integer","minimum":0},"confirmed_sold_units":{"type":["integer","null"],"minimum":0}}}}}
    CommerceEvidence:
      oneOf:
        - {$ref: '#/components/schemas/ResaleWeekEvidence'}
        - {$ref: '#/components/schemas/ResaleOwnerPayoutEvidence'}
        - {$ref: "#/components/schemas/CommerceCashEvidence"}
        - {$ref: "#/components/schemas/CommerceCatalogEvidence"}
        - {$ref: "#/components/schemas/CommerceDayEvidence"}
    StockPaymentEvidence:
      type: "object"
      additionalProperties: false
      required: ["offer_id","currency","contract_digest","po_id","product_id","observed_at","report_ref","kind","basis","cost_minor","cash_report_ref"]
      properties:
        offer_id: {"type":"string","format":"uuid"}
        currency: {"enum":["EUR","USD","GBP","BGN"]}
        contract_digest: {"type":"string","pattern":"^[a-f0-9]{64}$"}
        po_id: {"type":"string","pattern":"^[1-9][0-9]{0,19}$"}
