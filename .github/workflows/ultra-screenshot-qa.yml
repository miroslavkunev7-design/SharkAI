name: SharkAI Ultra Screenshot QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'public/sharkai/**'
      - '.github/workflows/ultra-screenshot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install and build (no production credentials)
        run: |
          npm ci --no-audit --no-fund
          node scripts/verify-original-assets.mjs
          npm run build
      - name: Install Chromium for locked-reference comparison
        run: npx --yes playwright@1.57.0 install --with-deps chromium
      - name: Start local production build and capture pages
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/sharkai-ci-server.log 2>&1 &
          for i in {1..65}; do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:3847/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3847/
          mkdir -p visual-qa
          npx --yes playwright@1.57.0 screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=1600 --full-page http://127.0.0.1:3847/wallet visual-qa/wallet-mobile-393.png
          npx --yes playwright@1.57.0 screenshot --browser chromium --viewport-size="430,932" --wait-for-timeout=1600 --full-page http://127.0.0.1:3847/wallet visual-qa/wallet-mobile-430.png
          npx --yes playwright@1.57.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1600 --full-page http://127.0.0.1:3847/wallet visual-qa/wallet-desktop-1440.png
          npx --yes playwright@1.57.0 screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=1600 --full-page http://127.0.0.1:3847/chat visual-qa/chat-mobile-393.png
          npx --yes playwright@1.57.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1600 --full-page http://127.0.0.1:3847/ visual-qa/home-desktop-1440.png
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharkai-ultra-visual-qa
          path: visual-qa/
          retention-days: 7
          if-no-files-found: warn
